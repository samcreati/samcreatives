    <style>
        :root { --primary: #D90429; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { font-family:'Poppins',sans-serif; background:#0a0a0a; color:#e0e0e0; padding-top:80px; position:relative; z-index:1; }
        h1,h2,h3,h4,h5,h6 { font-family:'Montserrat',sans-serif; font-weight:700; color:#fff; }
        .text-gradient { background:linear-gradient(135deg,#D90429,#ff4757); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .watermark-logo { position:fixed; top:0; left:0; width:100%; height:100%; background-image:url('images/logo-icon.png'); background-repeat:no-repeat; background-position:center center; background-size:300px auto; opacity:0.03; pointer-events:none; z-index:0; }
        .navbar { background:rgba(10,10,10,0.97); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.05); padding:10px 0; z-index:1000; position:relative; }
        .navbar.scrolled { box-shadow:0 5px 30px rgba(0,0,0,0.5); }
        .navbar-brand { display:flex; align-items:center; text-decoration:none; gap:10px; }
        .navbar-brand .logo-icon { height:42px; width:auto; }
        .navbar-brand .brand-text { display:flex; flex-direction:column; line-height:1.2; }
        .navbar-brand .brand-name { font-size:1.6rem; font-family:'Montserrat',sans-serif; letter-spacing:-0.5px; }
        .navbar-brand .brand-name .sam { font-weight:800; color:#D90429; }
        .navbar-brand .brand-name .creatives { font-weight:300; color:#888; }
        .navbar-brand .brand-tagline { font-size:0.7rem; font-family:'Poppins',sans-serif; color:#666; letter-spacing:1px; text-transform:uppercase; }
        .nav-link { color:#ccc !important; font-weight:500; font-size:0.85rem; padding:8px 12px !important; transition:0.3s; }
        .nav-link:hover, .nav-link.active { color:#D90429 !important; }
        .accordion-button { background:#1a1a1a !important; color:#fff !important; border:1px solid #333; font-weight:600; }
        .accordion-button:not(.collapsed) { background:#D90429 !important; color:#fff !important; }
        .accordion-button::after { filter:invert(1); }
        footer { background:#050505; border-top:1px solid #222; position:relative; z-index:1; }
        footer .text-muted, footer a.text-muted { color:#aaa !important; }
        footer .text-muted:hover { color:#D90429 !important; }
        footer h5, footer .brand-name { color:#fff !important; }
        @media (max-width:768px) { body { padding-top:70px; } }

</head>
