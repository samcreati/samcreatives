<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Tools | SAM Creatives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #D90429;
            --dark: #0a0a0a;
            --card: #1a1a1a;
            --text: #e0e0e0;
            --text-muted: #888;
            --border: rgba(255,255,255,0.08);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--dark);
            color: var(--text);
            padding-top: 80px;
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #D90429, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .navbar {
            background: rgba(10,10,10,0.97);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        
        .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            color: #fff !important;
            text-decoration: none;
        }
        
        .navbar-brand span { color: var(--primary); }
        
        .hero-section {
            padding: 60px 0 40px;
            text-align: center;
        }
        
        .hero-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .search-container {
            max-width: 500px;
            margin: 30px auto;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 45px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--card);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(217,4,41,0.2);
        }
        
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0 40px;
        }
        
        .filter-btn {
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        
        .tool-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            height: 100%;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        
        .tool-card:hover {
            transform: translateY(-5px);
            border-color: rgba(217,4,41,0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        
        .tool-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: rgba(217,4,41,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .tool-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .tool-description {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        
        .working-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #28a745;
            color: #fff;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        
        @media (max-width: 768px) {
            .hero-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span>SAM</span> Creatives</a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm">← Back to Home</a>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <h1 class="hero-title">Free <span class="text-gradient">AI Tools</span></h1>
            <p class="hero-subtitle">100% Free tools - No registration required</p>
            
            <div class="search-container">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search tools..." onkeyup="filterTools()">
            </div>
            
            <div class="category-filter" id="categoryFilter">
                <button class="filter-btn active" onclick="filterCategory('all', this)">All Tools</button>
                <button class="filter-btn" onclick="filterCategory('social', this)">Social Media</button>
                <button class="filter-btn" onclick="filterCategory('content', this)">Content</button>
                <button class="filter-btn" onclick="filterCategory('seo', this)">SEO</button>
                <button class="filter-btn" onclick="filterCategory('utility', this)">Utility</button>
                <button class="filter-btn" onclick="filterCategory('converter', this)">Converters</button>
            </div>
        </div>
    </section>

    <section class="container pb-5">
        <div class="row g-4" id="toolsGrid"></div>
    </section>

    <script>
        // Working Tools Data - Sirf wo tools jo actual mein kaam karte hain
        const tools = [
            // Video Downloaders
            { name:'Facebook & Instagram Downloader', description:'Download FB videos & Insta Reels in HD quality', icon:'📥', category:'utility', url:'facebook-instagram-downloader.html', tag:'Working' },
            { name:'YouTube Downloader', description:'Download YouTube videos free', icon:'🎥', category:'utility', url:'youtube-downloader.html', tag:'Working' },
            
            // Converters
            { name:'Word to PDF Converter', description:'Convert Word documents to PDF', icon:'📝', category:'converter', url:'word-pdf-converter.html', tag:'Working' },
            { name:'PDF to Word Converter', description:'Convert PDF to editable Word', icon:'📄', category:'converter', url:'word-pdf-converter.html', tag:'Working' },
            
            // Social Media Tools
            { name:'Hashtag Generator', description:'Find trending hashtags for social media', icon:'#️⃣', category:'social', url:'hashtag-generator.html', tag:'Working' },
            { name:'Social Post Generator', description:'Generate social media post ideas', icon:'📝', category:'social', url:'social-post-generator.html', tag:'Working' },
            
            // Image Tools
            { name:'Background Remover', description:'Remove background from images free', icon:'🖼️', category:'utility', url:'background-remover.html', tag:'Working' },
            { name:'Image Compressor', description:'Compress images without losing quality', icon:'📦', category:'utility', url:'image-compressor.html', tag:'Working' },
            
            // SEO Tools
            { name:'Keyword Research Tool', description:'Find keywords for your niche', icon:'🔍', category:'seo', url:'keyword-research.html', tag:'Working' },
            { name:'Meta Description Generator', description:'Generate SEO meta descriptions', icon:'📊', category:'seo', url:'meta-description-generator.html', tag:'Working' },
        ];
        
        function renderTools(toolsList) {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = '';
            
            if (toolsList.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center py-5"><h4 style="color:#888;">No tools found</h4></div>';
                return;
            }
            
            toolsList.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'col-lg-3 col-md-4 col-sm-6';
                card.innerHTML = `
                    <a href="${tool.url}" class="tool-card position-relative">
                        <span class="working-badge">✓ Working</span>
                        <div class="tool-icon">${tool.icon}</div>
                        <h3 class="tool-name">${tool.name}</h3>
                        <p class="tool-description">${tool.description}</p>
                    </a>
                `;
                grid.appendChild(card);
            });
        }
        
        function filterCategory(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (category === 'all') {
                renderTools(tools);
            } else {
                const filtered = tools.filter(t => t.category === category);
                renderTools(filtered);
            }
        }
        
        function filterTools() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tools.filter(tool => 
                tool.name.toLowerCase().includes(searchTerm) ||
                tool.description.toLowerCase().includes(searchTerm)
            );
            renderTools(filtered);
        }
        
        // Initial render
        renderTools(tools);
    </script>
</body>
</html>
