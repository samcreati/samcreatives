<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Social Media Post Generator - SAM Creatives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #D90429; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#0a0a0a; color:#e0e0e0; padding-top:80px; min-height:100vh; }
        h1,h2,h3,h4,h5,h6 { font-family:'Montserrat',sans-serif; font-weight:700; color:#fff; }
        .text-gradient { background:linear-gradient(135deg,#D90429,#ff4757); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        
        .navbar { background:rgba(10,10,10,0.97); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.05); padding:10px 0; }
        .navbar-brand { display:flex; align-items:center; text-decoration:none; gap:10px; }
        .navbar-brand .logo-icon { height:42px; width:auto; }
        .navbar-brand .brand-text { display:flex; flex-direction:column; line-height:1.2; }
        .navbar-brand .brand-name { font-size:1.6rem; font-family:'Montserrat',sans-serif; letter-spacing:-0.5px; }
        .navbar-brand .brand-name .sam { font-weight:800; color:#D90429; }
        .navbar-brand .brand-name .creatives { font-weight:300; color:#888; }
        .navbar-brand .brand-tagline { font-size:0.7rem; font-family:'Poppins',sans-serif; color:#666; letter-spacing:1px; text-transform:uppercase; }
        .nav-link { color:#ccc !important; font-weight:500; font-size:0.85rem; padding:8px 12px !important; transition:0.3s; }
        .nav-link:hover, .nav-link.active { color:#D90429 !important; }
        
        .tool-card {
            background:#1a1a1a;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px;
            padding:30px;
            margin-top:30px;
        }
        .form-control, .form-select {
            background:#0a0a0a;
            border:1px solid #333;
            color:#fff;
            padding:14px 20px;
            border-radius:12px;
        }
        .form-control:focus, .form-select:focus {
            background:#0a0a0a;
            border-color:#D90429;
            box-shadow:0 0 0 3px rgba(217,4,41,0.2);
            color:#fff;
        }
        .btn-primary-red {
            background:#D90429;
            border:2px solid #D90429;
            color:#fff;
            padding:12px 28px;
            border-radius:50px;
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:1px;
            font-size:0.8rem;
            transition:0.3s;
        }
        .btn-primary-red:hover {
            background:transparent;
            color:#D90429;
            transform:translateY(-3px);
            box-shadow:0 15px 30px rgba(217,4,41,0.3);
        }
        .btn-outline-light {
            border:2px solid #fff;
            color:#fff;
            background:transparent;
            padding:12px 28px;
            border-radius:50px;
            font-weight:600;
            transition:0.3s;
        }
        .btn-outline-light:hover {
            background:#fff;
            color:#000;
            transform:translateY(-3px);
        }
        .generated-post {
            background:#0a0a0a;
            border:1px solid #D90429;
            border-radius:15px;
            padding:20px;
            margin-top:20px;
        }
        .post-preview {
            background:#fff;
            color:#000;
            border-radius:15px;
            padding:20px;
            max-width:400px;
            margin:0 auto;
        }
        .post-preview img {
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:10px;
            margin-bottom:15px;
        }
        .hashtag {
            color:#D90429;
            font-weight:600;
            margin-right:8px;
            cursor:pointer;
        }
        .loading-spinner {
            display:none;
            text-align:center;
            padding:30px;
        }
        .spinner-border {
            color:#D90429;
            width:3rem;
            height:3rem;
        }
        .platform-tabs .nav-link {
            color:#ccc;
            background:transparent;
            border:none;
            padding:10px 20px;
            cursor:pointer;
        }
        .platform-tabs .nav-link.active {
            color:#D90429;
            border-bottom:3px solid #D90429;
        }
        .platform-tabs .nav-link:hover {
            color:#D90429;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo-icon.png" alt="SAM" class="logo-icon" onerror="this.style.display='none'">
                <span class="brand-text">
                    <span class="brand-name"><span class="sam">SAM</span><span class="creatives">Creatives</span></span>
                    <span class="brand-tagline">Design. Market. Grow.</span>
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon" style="filter:invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ai-tools.html">AI Tools</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="display-4 fw-bold">📝 Social Media <span class="text-gradient">Post Generator</span></h1>
            <p class="lead" style="color:#aaa;">Generate engaging posts with AI images - 100% Free & Unlimited!</p>
        </div>

        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="tool-card">
                    <!-- Platform Tabs -->
                    <ul class="nav platform-tabs mb-4 justify-content-center" id="platformTabs">
                        <li class="nav-item">
                            <button class="nav-link active" data-platform="instagram">📸 Instagram</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-platform="facebook">👥 Facebook</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-platform="linkedin">💼 LinkedIn</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-platform="twitter">🐦 Twitter/X</button>
                        </li>
                    </ul>

                    <form id="postForm">
                        <div class="mb-3">
                            <label class="form-label text-white fw-bold">Topic / Business Type:</label>
                            <input type="text" class="form-control" id="topic" placeholder="Example: Online clothing store, Restaurant, Digital Marketing Agency" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-white fw-bold">Key Message (Optional):</label>
                            <textarea class="form-control" id="message" rows="3" placeholder="Example: Summer sale up to 50% off, New menu launch, Free consultation"></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-white fw-bold">Tone:</label>
                                <select class="form-select" id="tone">
                                    <option value="professional">Professional</option>
                                    <option value="casual">Casual</option>
                                    <option value="funny">Funny</option>
                                    <option value="inspirational">Inspirational</option>
                                    <option value="urgent">Urgent</option>
                                    <option value="luxury">Luxury</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white fw-bold">Include Image:</label>
                                <select class="form-select" id="includeImage">
                                    <option value="yes">Yes - Generate AI Image</option>
                                    <option value="no">No - Text Only</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3" id="imageStyleContainer">
                            <label class="form-label text-white fw-bold">Image Style:</label>
                            <select class="form-select" id="imageStyle">
                                <option value="professional product photography">Professional Product Photography</option>
                                <option value="lifestyle photography">Lifestyle Photography</option>
                                <option value="minimalist flat lay">Minimalist Flat Lay</option>
                                <option value="vibrant colorful">Vibrant & Colorful</option>
                                <option value="elegant luxury">Elegant Luxury</option>
                                <option value="modern corporate">Modern Corporate</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary-red w-100 btn-lg">
                            <i class="bi bi-stars me-2"></i>Generate Post
                        </button>
                    </form>

                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="spinner-border mb-3" role="status"></div>
                        <p class="text-white">✨ Creating your post...</p>
                        <p class="text-muted small">Generating content and image</p>
                    </div>
                </div>

                <!-- Results -->
                <div id="resultsContainer" style="display:none;">
                    <div class="tool-card">
                        <h4 class="text-gradient mb-3">📱 Post Preview</h4>
                        <div class="post-preview" id="postPreview">
                            <!-- Dynamic content will be inserted here -->
                        </div>
                        
                        <div class="mt-4">
                            <h5 class="text-white mb-3">📋 Caption:</h5>
                            <div class="generated-post" id="captionText"></div>
                            
                            <h5 class="text-white mb-3 mt-3">#️⃣ Hashtags:</h5>
                            <div class="generated-post" id="hashtagsText"></div>
                        </div>

                        <div class="d-flex gap-2 mt-4 justify-content-center">
                            <button class="btn btn-primary-red" onclick="copyCaption()">
                                <i class="bi bi-clipboard me-2"></i>Copy Caption
                            </button>
                            <button class="btn btn-outline-light" onclick="copyHashtags()">
                                <i class="bi bi-hash me-2"></i>Copy Hashtags
                            </button>
                            <button class="btn btn-success" onclick="downloadPost()">
                                <i class="bi bi-download me-2"></i>Download
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPlatform = 'instagram';
        let currentImageUrl = '';
        let currentCaption = '';
        let currentHashtags = '';

        // Platform tabs
        document.querySelectorAll('#platformTabs .nav-link').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#platformTabs .nav-link').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentPlatform = this.dataset.platform;
            });
        });

        // Toggle image style visibility
        document.getElementById('includeImage').addEventListener('change', function() {
            document.getElementById('imageStyleContainer').style.display = this.value === 'yes' ? 'block' : 'none';
        });

        document.getElementById('postForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const topic = document.getElementById('topic').value;
            const message = document.getElementById('message').value;
            const tone = document.getElementById('tone').value;
            const includeImage = document.getElementById('includeImage').value;
            const imageStyle = document.getElementById('imageStyle').value;
            
            // Show loading
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('resultsContainer').style.display = 'none';
            
            // Generate content
            const content = generateContent(topic, message, tone, currentPlatform);
            currentCaption = content.caption;
            currentHashtags = content.hashtags;
            
            if (includeImage === 'yes') {
                // Generate AI image
                const imagePrompt = `${topic} ${message} ${imageStyle}`;
                const encodedPrompt = encodeURIComponent(imagePrompt);
                currentImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=600&nologo=true`;
                
                // Preload image
                const img = new Image();
                img.onload = function() {
                    showResults();
                };
                img.onerror = function() {
                    // If image fails, show without image
                    currentImageUrl = '';
                    showResults();
                };
                img.src = currentImageUrl;
            } else {
                currentImageUrl = '';
                showResults();
            }
        });
        
        function generateContent(topic, message, tone, platform) {
            let caption = '';
            let hashtags = [];
            
            const toneEmojis = {
                professional: '💼',
                casual: '😊',
                funny: '😄',
                inspirational: '✨',
                urgent: '⚡',
                luxury: '💎'
            };
            
            const emoji = toneEmojis[tone] || '✨';
            
            // Generate caption based on platform
            if (platform === 'instagram') {
                caption = `${emoji} ${message || 'Check out our amazing ' + topic + '!'}\n\n`;
                caption += `We're excited to share something special with you! ${topic} is here to make your life better.\n\n`;
                caption += `✨ Why choose us:\n`;
                caption += `✅ Premium quality\n✅ Affordable prices\n✅ Customer satisfaction\n\n`;
                caption += `Don't miss out! Link in bio 🔗\n\n`;
                hashtags = ['#instagram', '#instagood', '#trending', '#viral', '#explore', '#business', '#quality', '#instadaily', '#follow', '#like'];
            } else if (platform === 'facebook') {
                caption = `${emoji} ${message || 'Discover ' + topic + ' today!'}\n\n`;
                caption += `We're thrilled to announce our latest updates! ${topic} is now available with exclusive offers.\n\n`;
                caption += `Visit our page or contact us for more details!\n`;
                caption += `📞 Call now or message us today!\n\n`;
                hashtags = ['#facebook', '#business', '#community', '#local', '#deals', '#offer', '#quality', '#service', '#support', '#follow'];
            } else if (platform === 'linkedin') {
                caption = `${emoji} Exciting update from ${topic}!\n\n`;
                caption += `We're proud to share our latest achievement. ${message || 'Our team has been working hard to deliver exceptional results.'}\n\n`;
                caption += `Key highlights:\n`;
                caption += `📈 Proven results\n🎯 Strategic approach\n🤝 Client satisfaction\n\n`;
                caption += `Let's connect and grow together!\n\n`;
                hashtags = ['#linkedin', '#business', '#networking', '#professional', '#growth', '#success', '#leadership', '#innovation', '#career', '#opportunity'];
            } else if (platform === 'twitter') {
                caption = `${emoji} ${message || 'Big things coming with ' + topic + '!'}\n\n`;
                caption += `Don't miss out on this opportunity. Limited time only!\n\n`;
                caption += `👉 Follow us for more updates\n\n`;
                hashtags = ['#twitter', '#trending', '#viral', '#news', '#update', '#follow', '#socialmedia', '#digital', '#marketing', '#growth'];
            }
            
            // Add topic-specific hashtags
            const topicHashtags = topic.toLowerCase().split(' ').filter(w => w.length > 3).map(w => '#' + w.replace(/[^a-z0-9]/g, ''));
            hashtags = [...hashtags, ...topicHashtags].slice(0, 15);
            
            return { caption, hashtags: hashtags.join(' ') };
        }
        
        function showResults() {
            document.getElementById('loadingSpinner').style.display = 'none';
            
            // Build preview
            let previewHTML = '';
            if (currentImageUrl) {
                previewHTML += `<img src="${currentImageUrl}" alt="Generated Image">`;
            }
            previewHTML += `<p style="font-size:0.9rem; margin-bottom:10px;">${currentCaption.replace(/\n/g, '<br>')}</p>`;
            previewHTML += `<p style="font-size:0.8rem; color:#D90429;">${currentHashtags}</p>`;
            
            document.getElementById('postPreview').innerHTML = previewHTML;
            document.getElementById('captionText').innerHTML = currentCaption.replace(/\n/g, '<br>');
            document.getElementById('hashtagsText').innerHTML = currentHashtags;
            
            document.getElementById('resultsContainer').style.display = 'block';
            document.getElementById('resultsContainer').scrollIntoView({ behavior: 'smooth' });
        }
        
        function copyCaption() {
            navigator.clipboard.writeText(currentCaption).then(() => {
                alert('✅ Caption copied to clipboard!');
            });
        }
        
        function copyHashtags() {
            navigator.clipboard.writeText(currentHashtags).then(() => {
                alert('✅ Hashtags copied to clipboard!');
            });
        }
        
        function downloadPost() {
            if (currentImageUrl) {
                const link = document.createElement('a');
                link.download = 'sam-creatives-post-' + Date.now() + '.jpg';
                link.href = currentImageUrl;
                link.target = '_blank';
                link.click();
            } else {
                alert('No image to download. Generate with image first.');
            }
        }
    </script>
</body>
</html>
